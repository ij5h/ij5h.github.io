<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .profile {
      margin-bottom: 32px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background-color: var(--card-bg);
      border: 3px solid var(--accent);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .profile h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .profile p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background-color: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .link-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .link-icon {
      width: 24px;
      height: 24px;
      margin-right: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .link-card span {
      flex-grow: 1;
      text-align: left;
    }

        /* Discordなどの複数行テキスト用スタイル */
    .link-text-group {
      flex-grow: 1;
      text-align: left;
      display: flex;
      flex-direction: column;
    }

    .link-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .link-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .link-card:hover .link-sub {
      color: var(--text-main); /* ホバーした時にIDの色も明るくする */
    }

    .arrow {
      color: var(--text-sub);
      font-size: 1.2rem;
    }

    /* 各サービスのアクセントカラー */
    .youtube:hover { color: #ff0000; }
    .xbox:hover { color: #107c10; }
    .x:hover { color: #ffffff; }
    .github:hover { color: #f0f6fc; }
    .bsky:hover { color: #0085ff; }
    .website:hover { color: var(--accent); }
    .roblox:hover { color: #000000; }  /* ダークモードなら #ffffff もおすすめ */
    .discord:hover { color: #5865F2; }
  </style>
</head>
